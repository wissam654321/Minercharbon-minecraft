<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Studio</title>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">

<style>
/* ==========================================================
   🎨 ÉTAPE 1 : LES COULEURS (change les codes #xxxxxx)
   ========================================================== */
:root{
  --fond:   #06071a;   /* fond de la page */
  --panneau:#0e1131;   /* fond des cartes */
  --indigo: #6366f1;   /* couleur 1 */
  --cyan:   #22d3ee;   /* couleur 2 */
  --rose:   #e879f9;   /* couleur 3 */
  --texte:  #eef0ff;   /* texte */
  --gris:   #9aa3c7;   /* texte secondaire */
}

/* ----- Le style : tu n'as pas besoin d'y toucher ----- */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans','Segoe UI',system-ui,sans-serif;line-height:1.65;overflow-x:hidden}
h1,h2,h3,.marque{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;letter-spacing:-.02em}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 26px}
section{padding:110px 0;position:relative}
.grad{background:linear-gradient(110deg,var(--cyan),var(--indigo),var(--rose),var(--cyan));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:defgrad 6s linear infinite}
@keyframes defgrad{to{background-position:250% 0}}

/* décor de fond */
#stars{position:fixed;inset:0;z-index:-3;width:100%;height:100%}
.aurora{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);animation:derive 16s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:560px;height:560px;background:rgba(99,102,241,.38);top:-120px;left:-100px}
.aurora i:nth-child(2){width:500px;height:500px;background:rgba(232,121,249,.22);bottom:-140px;right:-80px;animation-delay:-8s}
@keyframes derive{to{transform:translate(120px,80px) scale(1.2)}}
.grille{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(165,180,252,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(165,180,252,.5) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 30%,#000,transparent 70%)}

/* menu */
header{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 20px;display:flex;justify-content:center}
nav{width:100%;max-width:1200px;height:58px;border-radius:18px;padding:0 18px;display:flex;justify-content:space-between;align-items:center;background:rgba(14,17,49,.7);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.09)}
.marque{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:10px}
.logo-nav{height:32px;width:auto}
.liens{display:flex;gap:26px;align-items:center;font-weight:500;font-size:.95rem}
.liens a:not(.btn-nav){color:var(--gris);transition:color .2s}
.liens a:not(.btn-nav):hover{color:#fff}
.btn-nav{padding:9px 18px;border-radius:12px;background:var(--indigo);font-weight:600;box-shadow:0 8px 24px -8px var(--indigo);transition:transform .2s}
.btn-nav:hover{transform:translateY(-2px)}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:14px;font-weight:600;border:1px solid transparent;transition:transform .25s,box-shadow .25s,background .25s}
.btn-plein{background:linear-gradient(120deg,var(--indigo),#8b5cf6);box-shadow:0 14px 34px -10px var(--indigo)}
.btn-plein:hover{transform:translateY(-4px);box-shadow:0 22px 44px -10px var(--indigo)}
.btn-verre{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
.btn-verre:hover{background:rgba(255,255,255,.13);transform:translateY(-4px)}

/* ===== HERO ===== */
#hero{padding:140px 0 70px}
.hero-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:40px;font-size:.88rem;font-weight:500;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);margin-bottom:24px}
.badge i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
h1{font-size:clamp(2.6rem,5.4vw,4.4rem);line-height:1.04;font-weight:800;margin-bottom:22px}
.hero-txt p{color:var(--gris);font-size:1.15rem;max-width:460px;margin-bottom:34px}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.hero-txt>*{opacity:0;animation:monte .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero-txt>*:nth-child(2){animation-delay:.12s}.hero-txt>*:nth-child(3){animation-delay:.24s}.hero-txt>*:nth-child(4){animation-delay:.36s}.hero-txt>*:nth-child(5){animation-delay:.48s}
.hero-txt .logo-hero{width:100%;height:auto;margin:0;position:relative;filter:drop-shadow(0 0 44px rgba(99,102,241,.75));animation:monte .9s .14s cubic-bezier(.2,.7,.2,1) both,flotte 6s 1.2s ease-in-out infinite}
.hero-txt .note{font-size:.95rem;margin:26px 0 0;padding-left:14px;border-left:3px solid var(--indigo)}
@keyframes monte{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

/* ===== CARROUSEL 3D ===== */
.scene{animation:monte 1.1s .2s cubic-bezier(.2,.7,.2,1) both}
.viewport{position:relative;height:430px;perspective:1100px;cursor:grab;user-select:none;touch-action:pan-y}
.viewport:active{cursor:grabbing}
.viewport::before{content:'';position:absolute;left:12%;right:12%;bottom:8px;height:70px;background:radial-gradient(ellipse,rgba(99,102,241,.6),transparent 70%);filter:blur(18px)}
.stage{position:absolute;inset:0;transform-style:preserve-3d}
.c3d{position:absolute;left:50%;top:50%;width:250px;height:340px;margin:-170px 0 0 -125px;border-radius:26px;overflow:hidden;background:var(--panneau);border:1px solid rgba(255,255,255,.14);box-shadow:0 36px 70px -24px rgba(0,0,0,.9);will-change:transform,opacity;transition:border-color .3s,box-shadow .3s}
.c3d img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.c3d::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(6,7,26,.95) 8%,transparent 55%)}
.c3d-info{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.c3d-info b{display:block;font-family:'Bricolage Grotesque';font-size:1.25rem}
.c3d-info span{font-size:.85rem;color:var(--cyan);font-weight:600}
.c3d.actif{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo),0 30px 80px -20px rgba(99,102,241,.9)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 18px}
#dots{display:flex;gap:9px}
#dots i{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.25);cursor:pointer;transition:width .35s,background .35s}
#dots i.on{width:30px;background:linear-gradient(90deg,var(--cyan),var(--indigo))}
.detail{padding:24px 26px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);min-height:170px}
.detail.swap>*{animation:monte .5s cubic-bezier(.2,.7,.2,1) both}
.detail.swap>*:nth-child(2){animation-delay:.06s}.detail.swap>*:nth-child(3){animation-delay:.12s}.detail.swap>*:nth-child(4){animation-delay:.18s}
.etiq{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.etiq span{font-size:.8rem;font-weight:600;padding:4px 12px;border-radius:30px;background:rgba(34,211,238,.14);color:var(--cyan)}
.etiq .st{background:var(--indigo);color:#fff}
.detail h3{font-size:1.55rem;margin-bottom:6px}
.detail p{color:var(--gris);font-size:.98rem;margin-bottom:12px}
.detail small{color:var(--gris)}.detail small b{color:#fff}
.detail a{color:var(--cyan);font-weight:600;float:right}

/* ===== TITRES ===== */
.titre-bloc{max-width:640px;margin-bottom:60px}
.titre-bloc h2{font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.1;font-weight:800;margin-bottom:14px}
.titre-bloc p{color:var(--gris);font-size:1.1rem}

/* ===== À PROPOS ===== */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes tourne{to{--a:360deg}}
#apropos .wrap{max-width:820px;text-align:center}
#apropos h2{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;line-height:1.1;margin-bottom:20px}
#apropos .wrap>p{color:var(--gris);font-size:1.15rem;margin:0 auto 40px;max-width:640px}
.benevole{display:flex;gap:20px;align-items:center;text-align:left;padding:26px 30px;border-radius:24px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.35);box-shadow:0 30px 60px -35px rgba(99,102,241,.8)}
.benevole .ico{margin:0;flex:none}
.benevole h3{font-size:1.25rem;margin-bottom:4px}
.benevole p{color:var(--gris)}

/* ===== RECRUTEMENT ===== */
.postes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-bottom:34px}
.poste{position:relative;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:30px 26px;transition:transform .3s,border-color .3s,opacity .8s}
.poste::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(99,102,241,.32),transparent 70%)}
.poste:hover{transform:translateY(-8px);border-color:rgba(99,102,241,.7)}
.poste:hover::before{opacity:1}
.poste>*{position:relative}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;margin-bottom:18px;background:linear-gradient(135deg,rgba(99,102,241,.3),rgba(34,211,238,.18))}
.poste h3{font-size:1.2rem;margin-bottom:8px}
.poste p{color:var(--gris);font-size:.97rem}
.etapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px;counter-reset:e;padding:28px 32px;margin-bottom:38px;border-radius:22px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25)}
.etape{display:flex;gap:16px;align-items:center;font-weight:600;counter-increment:e}
.etape::before{content:counter(e);flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;background:linear-gradient(135deg,var(--indigo),var(--rose))}
.recrut-cta{text-align:center}

/* ===== DISCORD ===== */
#discord{padding-top:30px}
.dc2{border-radius:42px;padding:2px;background:conic-gradient(from var(--a),#5865f2,var(--cyan),var(--rose),#5865f2);animation:tourne 8s linear infinite;box-shadow:0 60px 120px -50px rgba(88,101,242,.9)}
.dc2-in{position:relative;overflow:hidden;border-radius:40px;padding:72px 62px;display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center;background:radial-gradient(90% 120% at 0% 0%,rgba(88,101,242,.4),transparent 60%),radial-gradient(70% 90% at 100% 100%,rgba(232,121,249,.22),transparent 60%),#0a0c26}
.srv{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.srv img{width:70px;height:70px;border-radius:22px;object-fit:cover;box-shadow:0 0 0 3px rgba(88,101,242,.55),0 0 44px rgba(88,101,242,.8)}
.srv b{font-family:'Bricolage Grotesque';font-size:1.35rem}
.dc2 h2{font-size:clamp(2.1rem,4.8vw,3.5rem);font-weight:800;line-height:1.06;margin-bottom:16px}
.dc2 p{color:var(--gris);font-size:1.12rem;margin-bottom:34px;max-width:480px}
.btn-dc{position:relative;overflow:hidden;padding:18px 38px;font-size:1.05rem;background:linear-gradient(120deg,#5865f2,#7c3aed);box-shadow:0 18px 44px -10px rgba(88,101,242,.9)}
.btn-dc:hover{transform:translateY(-4px) scale(1.04)}
.btn-dc::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:brille 3.2s infinite}
@keyframes brille{60%,100%{left:140%}}
.avantages{list-style:none;display:grid;gap:16px;align-content:center}
.avantages li{display:flex;gap:14px;align-items:center;padding:18px 22px;border-radius:20px;font-weight:600;opacity:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);box-shadow:0 24px 44px -22px rgba(0,0,0,.7)}
.avantages li:nth-child(even){margin-left:34px}
.avantages li::before{content:'✓';display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;font-weight:800;background:linear-gradient(135deg,var(--indigo),var(--cyan))}
.dc2.visible .avantages li{animation:monte .7s cubic-bezier(.2,.7,.2,1) var(--d) both,flotte 6s ease-in-out calc(var(--d) + .8s) infinite}
@keyframes flotte{50%{transform:translateY(-9px)}}
.reseaux{display:flex;gap:26px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.reseaux a{color:var(--gris);transition:color .2s}.reseaux a:hover{color:var(--cyan)}
footer{text-align:center;padding:30px 20px 44px;color:var(--gris);font-size:.9rem}

/* ===== EXTRAS STYLE ===== */
#curseur{position:fixed;top:0;left:0;width:500px;height:500px;border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(circle,rgba(99,102,241,.22),transparent 65%)}
@media(hover:none){#curseur{display:none}}
.logo-zone{position:relative;width:min(260px,66%);margin:0 0 34px;display:grid;place-items:center}
.c3d.actif::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.24) 50%,transparent 65%);transform:translateX(-130%);animation:balayage 3.8s infinite}
@keyframes balayage{55%,100%{transform:translateX(130%)}}
.titre-bloc h2::after,#apropos h2::after{content:'';display:block;width:0;height:5px;border-radius:5px;margin-top:14px;background:linear-gradient(90deg,var(--cyan),var(--indigo),var(--rose));box-shadow:0 0 18px rgba(99,102,241,.8);transition:width 1.1s .3s cubic-bezier(.2,.7,.2,1)}
#apropos h2::after{margin-inline:auto}
.visible h2::after{width:96px}
.ico{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.poste:hover .ico{transform:rotate(-10deg) scale(1.18)}
.pastille{position:fixed;right:22px;bottom:22px;z-index:90;padding:13px 22px;border-radius:50px;font-weight:600;background:linear-gradient(120deg,#5865f2,#7c3aed);box-shadow:0 14px 36px -8px rgba(88,101,242,.9);transition:transform .3s,opacity .4s}
.pastille::before{content:'';position:absolute;inset:0;border-radius:50px;animation:onde 2.4s infinite}
@keyframes onde{0%{box-shadow:0 0 0 0 rgba(88,101,242,.7)}70%,100%{box-shadow:0 0 0 16px rgba(88,101,242,0)}}
.pastille:hover{transform:translateY(-4px) scale(1.05)}
.pastille.off{opacity:0;pointer-events:none;transform:translateY(20px)}
@media(max-width:860px){.logo-zone{margin:0 0 30px}.pastille{right:14px;bottom:14px;padding:11px 18px;font-size:.9rem}}

.onde-clic{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--cyan);pointer-events:none;z-index:300;animation:clic .7s ease-out forwards}
@keyframes clic{to{transform:scale(6);opacity:0;border-color:var(--rose)}}
.etincelle{position:fixed;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;pointer-events:none;z-index:300;animation:etincelle .8s ease-out forwards}
@keyframes etincelle{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
footer{position:relative}
footer::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--indigo),var(--cyan),var(--rose),transparent)}

/* apparition au scroll (sans JS : tout reste visible) */
.js .cache{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}
.js .cache.visible{opacity:1;transform:none}

@media(max-width:860px){
  .hero-grid,#apropos .wrap,.dc2-in{grid-template-columns:1fr}
  .dc2-in{padding:46px 24px;gap:40px}.avantages li{margin-left:0!important}
  .liens a:not(.btn-nav){display:none}
  #apropos .wrap{gap:44px}section{padding:80px 0}.viewport{height:380px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero-txt>*,.scene,.avantages li{opacity:1!important}}
</style>
</head>

<body>
<canvas id="stars"></canvas>
<div id="curseur"></div>
<div class="aurora"><i></i><i></i></div>
<div class="grille"></div>

<header>
  <nav>
    <a href="#hero" class="marque" id="logo"></a>
    <div class="liens">
      <a href="#hero">Jeux</a>
      <a href="#apropos">À propos</a>
      <a href="#recrutement">Recrutement</a>
      <a class="btn-nav" id="nav-dc" target="_blank" rel="noopener">Discord</a>
    </div>
  </nav>
</header>

<main>
  <section id="hero">
    <div class="wrap hero-grid">
      <div class="hero-txt">
        <span class="badge"><i></i><span id="badge"></span></span>
        <div class="logo-zone"><img class="logo-hero" id="logo-hero" alt="Logo du studio" data-hide="1"></div>
        <div class="actions">
          <a href="#recrutement" class="btn btn-plein">Devenir développeur</a>
          <a class="btn btn-verre" id="hero-dc" target="_blank" rel="noopener">Rejoindre le Discord</a>
        </div>
        <p class="note" id="note"></p>
      </div>
      <div class="scene">
        <div class="viewport" id="viewport"><div class="stage" id="stage"></div></div>
        <div class="ctrl">
          <div id="dots"></div>
        </div>
        <div class="detail" id="detail"></div>
      </div>
    </div>
  </section>

  <section id="apropos">
    <div class="wrap cache">
      <h2 id="ap-titre"></h2>
      <p id="ap-texte"></p>
      <div class="benevole"><div class="ico">🤝</div><div><h3 id="bn-titre"></h3><p id="bn-texte"></p></div></div>
    </div>
  </section>

  <section id="recrutement">
    <div class="wrap">
      <div class="titre-bloc cache"><h2 id="rc-titre"></h2><p id="rc-texte"></p></div>
      <div class="postes" id="postes"></div>
      <div class="etapes cache" id="etapes"></div>
      <div class="recrut-cta cache"><a class="btn btn-plein" id="rc-bouton" target="_blank" rel="noopener"></a></div>
    </div>
  </section>

  <section id="discord">
    <div class="wrap">
      <div class="dc2 cache">
        <div class="dc2-in">
          <div>
            <div class="srv"><img id="dc-icone" alt="Logo du serveur Discord"><b id="dc-nom"></b></div>
            <h2 id="dc-titre"></h2>
            <p id="dc-texte"></p>
            <a class="btn btn-dc" id="dc-bouton" target="_blank" rel="noopener"></a>
          </div>
          <ul class="avantages" id="dc-avantages"></ul>
        </div>
      </div>
    </div>
  </section>
</main>

<a class="pastille" id="pastille" target="_blank" rel="noopener">💬 Rejoindre le Discord</a>

<footer><div class="reseaux" id="reseaux"></div><p id="footer"></p></footer>


<script>
/* ==========================================================
   ✏️ ÉTAPE 2 : TOUT TON CONTENU EST ICI
   Change seulement ce qui est entre guillemets "..."
   Pour une image : colle ton lien entre les guillemets.
   Garde bien les guillemets, les virgules et les { }
   ========================================================== */
const SITE = {

  // ----- Toi -----
  nom: "Nom du Studio",
  logo: "https://raw.githubusercontent.com/wissam654321/Project-Fortnite-Launcheur/refs/heads/main/NITFORT-%C2%A9-LG.ico",   // 🖼️ ton logo (affiché en grand en haut)
  badge: "On recrute des développeurs",
  note: "🤝 Projet bénévole : les jeux avancent à leur rythme. Merci pour ta patience !",

  // ----- Tes jeux : ce sont les cartes 3D qu'on fait glisser -----
  // Copie/colle un bloc { ... } pour ajouter un jeu
  jeux: [
    {
      titre: "Neon Runner",
      statut: "Disponible",
      genre: "Action / Course",
      description: "Un jeu de course nerveux dans une ville futuriste.",
      plateformes: "PC, Scratch",
       image: "",   // 🖼️ colle ici le lien de ton image (ou laisse vide : une image colorée s'affiche)
      lien: "#",                                               // 🔗 lien pour jouer
      texteLien: "Jouer →"
    },
    {
      titre: "Dragon Forge",
      statut: "Prototype",
      genre: "RPG",
      description: "Forge des armes, explore des donjons et affronte des dragons.",

/* ==========================================================
   ⚙️ ÉTAPE 3 : LE MOTEUR (pas besoin d'y toucher)
   ========================================================== */
document.documentElement.classList.add('js');
const $ = id => document.getElementById(id);
const D = SITE.discord, R = SITE.recrutement, N = SITE.jeux.length;

// Images automatiques : si un lien est vide ou ne marche pas, une image colorée s'affiche à la place
const PH = (t, i = 0) => {
  const c = [[99,102,241],[34,211,238],[232,121,249],[52,211,153]][i % 4];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgb(${c})"/><stop offset="1" stop-color="#1b1140"/></linearGradient></defs><rect width="600" height="800" fill="url(#g)"/><circle cx="450" cy="200" r="210" fill="rgba(255,255,255,.12)"/><circle cx="120" cy="700" r="160" fill="rgba(255,255,255,.08)"/><text x="300" y="450" fill="#fff" font-family="Arial" font-size="190" font-weight="800" text-anchor="middle">${(t || '?')[0].toUpperCase()}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};
const IMG = (src, t, i) => src || PH(t, i);
document.addEventListener('error', e => {
  const el = e.target;
  if (el.tagName !== 'IMG' || el.dataset.fb) return;
  el.dataset.fb = 1;
  if (el.dataset.hide) el.style.display = 'none';
  else el.src = PH(el.alt, +el.dataset.i || 0);
}, true);

// Textes
document.title = SITE.nom;
$('logo').innerHTML = `<img class="logo-nav" src="${SITE.logo}" alt="" data-hide="1"> ${SITE.nom}`;
$('logo-hero').src = SITE.logo;
$('badge').textContent = SITE.badge;
$('nav-dc').href = $('hero-dc').href = $('dc-bouton').href = $('rc-bouton').href = D.invitation;

$('ap-titre').textContent = SITE.apTitre;
$('ap-texte').textContent = SITE.apTexte;
$('bn-titre').textContent = SITE.benevole.titre;
$('bn-texte').textContent = SITE.benevole.texte;
$('note').textContent = SITE.note;

$('rc-titre').textContent = R.titre;
$('rc-texte').textContent = R.texte;
$('postes').innerHTML = R.postes.map((x, i) => `<div class="poste cache" style="transition-delay:${i * .1}s"><div class="ico">${x.icone}</div><h3>${x.titre}</h3><p>${x.texte}</p></div>`).join('');
$('etapes').innerHTML = R.etapes.map(e => `<div class="etape">${e}</div>`).join('');
$('rc-bouton').textContent = R.bouton;

$('dc-titre').textContent = D.titre;
$('dc-texte').textContent = D.texte;
$('dc-avantages').innerHTML = D.avantages.map((a, i) => `<li style="--d:${.3 + i * .25}s">${a}</li>`).join('');
$('dc-bouton').textContent = D.bouton;
$('dc-icone').alt = D.nom;
$('dc-icone').src = IMG(D.icone, D.nom, 3);
$('dc-nom').textContent = D.nom;
$('reseaux').innerHTML = SITE.reseaux.map(r => `<a href="${r.lien}">${r.nom}</a>`).join('');
$('footer').textContent = `© ${new Date().getFullYear()} ${SITE.nom}. Tous droits réservés.`;

// ===== Carrousel 3D (cartes déroulantes) =====
const stage = $('stage'), view = $('viewport'), cards = [];
let cur = 0, target = 0, drag = false, moved = false, sx = 0, st = 0, shown = -1, hover = false;

SITE.jeux.forEach((j, i) => {
  const c = document.createElement('div');
  c.className = 'c3d';
  c.innerHTML = `<img src="${IMG(j.image, j.titre, i)}" alt="${j.titre}" data-i="${i}" draggable="false"><div class="c3d-info"><b>${j.titre}</b><span>${j.statut}</span></div>`;
  c.addEventListener('click', () => { if (!moved) aller(i); });
  stage.appendChild(c); cards.push(c);
});
$('dots').innerHTML = SITE.jeux.map(() => '<i></i>').join('');
[...$('dots').children].forEach((d, i) => d.addEventListener('click', () => aller(i)));

function aller(i){                       // va vers la carte i par le chemin le plus court
  let w = ((Math.round(target) % N) + N) % N, d = i - w;
  if (d > N / 2) d -= N; if (d < -N / 2) d += N;
  target = Math.round(target) + d;
}
function afficher(i){                    // met à jour la fiche du jeu au centre
  const j = SITE.jeux[i], box = $('detail');
  box.innerHTML = `<div class="etiq"><span class="st">${j.statut}</span><span>${j.genre}</span></div><h3>${j.titre}</h3><p>${j.description}</p><div><small>Plateformes : <b>${j.plateformes}</b></small><a href="${j.lien}">${j.texteLien}</a></div>`;
  box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap');
  cards.forEach((c, k) => c.classList.toggle('actif', k === i));
  [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === i));
}
function boucle(){
  cur += (target - cur) * .12;
  cards.forEach((c, i) => {
    let o = (i - cur) % N;
    if (o < -N / 2) o += N; if (o > N / 2) o -= N;
    const a = Math.abs(o);
    c.style.transform = `translate3d(${o * 185}px,0,${-a * 200}px) rotateY(${o * -38}deg)`;
    c.style.opacity = a < .05 ? 1 : Math.max(.15, .8 - a * .3);
    c.style.zIndex = Math.round(100 - a * 10);
  });
  const idx = ((Math.round(cur) % N) + N) % N;
  if (idx !== shown){ shown = idx; afficher(idx); }
  requestAnimationFrame(boucle);
}
// glisser à la souris / au doigt
const debut = x => { drag = true; moved = false; sx = x; st = target; };
const bouge = x => { if (!drag) return; if (Math.abs(x - sx) > 5) moved = true; target = st - (x - sx) / 200; };
const fin = () => { if (!drag) return; drag = false; target = Math.round(target); setTimeout(() => moved = false, 50); };
view.addEventListener('mousedown', e => debut(e.clientX));
addEventListener('mousemove', e => bouge(e.clientX));
addEventListener('mouseup', fin);
view.addEventListener('touchstart', e => debut(e.touches[0].clientX), { passive: true });
addEventListener('touchmove', e => bouge(e.touches[0].clientX), { passive: true });
addEventListener('touchend', fin);
view.addEventListener('mouseenter', () => hover = true);
view.addEventListener('mouseleave', () => hover = false);
setInterval(() => { if (!drag && !hover) target = Math.round(target) + 1; }, 4500);   // défilement automatique
boucle();

// ===== Apparition au scroll + compteurs =====
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('visible'); obs.unobserve(e.target);
  e.target.querySelectorAll('b[data-v]').forEach(b => {
    const m = b.dataset.v.match(/^(\d+)(.*)$/); if (!m) return;
    const fin = +m[1]; let n = 0;
    const t = setInterval(() => { n += Math.max(1, Math.ceil(fin / 40)); if (n >= fin){ n = fin; clearInterval(t); } b.textContent = n + m[2]; }, 35);
  });
}), { threshold: .12 });
document.querySelectorAll('.cache').forEach(el => obs.observe(el));
setTimeout(() => document.querySelectorAll('.cache').forEach(el => el.classList.add('visible')), 3500);  // sécurité : rien ne reste caché

// ===== Lueur sur les cartes de postes + barre de progression =====
document.querySelectorAll('.poste').forEach(p => p.addEventListener('mousemove', e => {
  const r = p.getBoundingClientRect();
  p.style.setProperty('--mx', e.clientX - r.left + 'px'); p.style.setProperty('--my', e.clientY - r.top + 'px');
}));

// ===== Étoiles qui montent doucement =====
const cv = $('stars'), cx = cv.getContext('2d'); let W, H;
const meteores = [];
const etoiles = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .4, v: Math.random() * .0004 + .0001 }));
function taille(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', taille); taille();
(function etoile(){
  cx.clearRect(0, 0, W, H);
  etoiles.forEach(s => {
    s.y -= s.v; if (s.y < 0){ s.y = 1; s.x = Math.random(); }
    cx.beginPath(); cx.arc(s.x * W, s.y * H, s.r, 0, 7);
    cx.fillStyle = `rgba(190,200,255,${.25 + s.r / 3})`; cx.fill();
  });
  if (Math.random() < .006) meteores.push({ x: Math.random() * W, y: Math.random() * H * .35, vx: -9, vy: 5, a: 1 });
  for (let k = meteores.length - 1; k >= 0; k--) {
    const m = meteores[k]; m.x += m.vx; m.y += m.vy; m.a -= .016;
    const g = cx.createLinearGradient(m.x, m.y, m.x - m.vx * 14, m.y - m.vy * 14);
    g.addColorStop(0, `rgba(255,255,255,${Math.max(m.a, 0)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    cx.strokeStyle = g; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(m.x, m.y); cx.lineTo(m.x - m.vx * 14, m.y - m.vy * 14); cx.stroke();
    if (m.a <= 0) meteores.splice(k, 1);
  }
  requestAnimationFrame(etoile);
})();

// ===== Lueur qui suit la souris + pastille Discord =====
const lueur = $('curseur'); let mx = innerWidth / 2, my = innerHeight / 2, lx = mx, ly = my;
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
(function suit(){ lx += (mx - lx) * .1; ly += (my - ly) * .1; lueur.style.transform = `translate(${lx - 250}px,${ly - 250}px)`; requestAnimationFrame(suit); })();
$('pastille').href = D.invitation;
new IntersectionObserver(es => es.forEach(e => $('pastille').classList.toggle('off', e.isIntersecting))).observe($('discord'));

// ===== Effets en plus : étincelles, clic, inclinaison des cartes =====
if (matchMedia('(hover:hover)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
  let dernier = 0; const coul = ['#22d3ee', '#6366f1', '#e879f9', '#ffffff'];
  addEventListener('mousemove', e => {                       // étincelles derrière la souris
    const t = Date.now(); if (t - dernier < 45) return; dernier = t;
    const c = coul[Math.random() * 4 | 0], d = document.createElement('i');
    d.className = 'etincelle';
    d.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;background:${c};box-shadow:0 0 10px ${c};--dx:${(Math.random() - .5) * 40}px;--dy:${Math.random() * 40 + 10}px`;
    document.body.appendChild(d); setTimeout(() => d.remove(), 800);
  });
}
addEventListener('click', e => {                             // onde de couleur au clic
  const o = document.createElement('i'); o.className = 'onde-clic';
  o.style.left = e.clientX + 'px'; o.style.top = e.clientY + 'px';
  document.body.appendChild(o); setTimeout(() => o.remove(), 700);
});
document.querySelectorAll('.poste').forEach(p => {           // les cartes de recrutement se penchent
  p.addEventListener('mouseenter', () => p.style.transition = 'transform .12s ease-out,border-color .3s');
  p.addEventListener('mousemove', e => {
    const r = p.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    p.style.transform = `perspective(700px) rotateY(${x * 12}deg) rotateX(${-y * 12}deg) translateY(-8px)`;
  });
  p.addEventListener('mouseleave', () => { p.style.transform = ''; p.style.transition = 'transform .5s,border-color .3s'; });
});
</script>
</body>
